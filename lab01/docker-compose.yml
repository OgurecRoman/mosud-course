services:
  postgres:
    image: postgres:17
    container_name: mosud-postgres
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 111
    ports:
      - "5432:5432"
    volumes:
      - mosud_pgdata:/var/lib/postgresql/data

volumes:
  mosud_pgdata:
